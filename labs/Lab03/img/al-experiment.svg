<svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" data-d-component="svg" fill="currentColor" style="color:rgb(255, 255, 255)" viewBox="0 0 1050 340" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="1046" height="336" rx="8" fill="white"/><g font-family="Arial, sans-serif" fill="#182b45"><rect x="15" y="75" width="173" height="174" rx="9" fill="#f7f9fc" stroke="#9caaba"/><text x="101" y="99" font-size="16" font-weight="bold" text-anchor="middle">Same starting point</text><text x="101" y="127" font-size="14" text-anchor="middle">BANKING77</text><text x="101" y="147" font-size="12" text-anchor="middle">9 selected intents</text><path d="M32 160 H171" stroke="#d4dce6"/><text x="101" y="181" font-size="13" text-anchor="middle">Initial labeled set L₀</text><text x="101" y="203" font-size="13" text-anchor="middle">Unlabeled pool U₀</text><text x="101" y="225" font-size="13" text-anchor="middle">Validation set V</text><path d="M190 161 H230" stroke="#71839a" stroke-width="2" fill="none"/><path d="M222 154 L231 161 L222 168" stroke="#71839a" stroke-width="2" fill="none"/><text x="345" y="39" font-size="16" font-weight="bold" text-anchor="middle">Four independent runs</text><rect x="235" y="69" width="218" height="45" rx="7" fill="white" stroke="#557aaf" stroke-width="1.8"/><circle cx="253" cy="91.5" r="5" fill="#557aaf"/><text x="274" y="97" font-size="15" font-weight="bold">Random sampling</text><path d="M453 91.5 H493" stroke="#71839a" stroke-width="1.6"/><rect x="235" y="125" width="218" height="45" rx="7" fill="white" stroke="#368b70" stroke-width="1.8"/><circle cx="253" cy="147.5" r="5" fill="#368b70"/><text x="274" y="153" font-size="15" font-weight="bold">Least confidence</text><path d="M453 147.5 H493" stroke="#71839a" stroke-width="1.6"/><rect x="235" y="181" width="218" height="45" rx="7" fill="white" stroke="#c08436" stroke-width="1.8"/><circle cx="253" cy="203.5" r="5" fill="#c08436"/><text x="274" y="209" font-size="15" font-weight="bold">Margin sampling</text><path d="M453 203.5 H493" stroke="#71839a" stroke-width="1.6"/><rect x="235" y="237" width="218" height="45" rx="7" fill="white" stroke="#8b6bb6" stroke-width="1.8"/><circle cx="253" cy="259.5" r="5" fill="#8b6bb6"/><text x="274" y="265" font-size="15" font-weight="bold">Entropy sampling</text><path d="M453 259.5 H493" stroke="#71839a" stroke-width="1.6"/><rect x="493" y="70" width="245" height="216" rx="9" fill="#f8fafc" stroke="#9caaba"/><text x="615" y="94" font-size="16" font-weight="bold" text-anchor="middle">Repeat each round</text><rect x="512" y="106" width="207" height="26" rx="5" fill="white" stroke="#d3dce7"/><text x="615" y="123" font-size="12.5" text-anchor="middle">Select 20 examples</text><rect x="512" y="137" width="207" height="26" rx="5" fill="white" stroke="#d3dce7"/><text x="615" y="154" font-size="12.5" text-anchor="middle">Reveal reference labels</text><rect x="512" y="168" width="207" height="26" rx="5" fill="white" stroke="#d3dce7"/><text x="615" y="185" font-size="12.5" text-anchor="middle">Update labeled set / pool</text><rect x="512" y="199" width="207" height="26" rx="5" fill="white" stroke="#d3dce7"/><text x="615" y="216" font-size="12.5" text-anchor="middle">Retrain classifier</text><rect x="512" y="230" width="207" height="26" rx="5" fill="white" stroke="#d3dce7"/><text x="615" y="247" font-size="12.5" text-anchor="middle">Evaluate on V</text><path d="M726 120 Q748 120 748 145 V238 Q748 262 726 262" fill="none" stroke="#6683a8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="615" y="278" font-size="11" text-anchor="middle" fill="#56677d">Repeat for N rounds</text><path d="M749 174 H789" stroke="#71839a" stroke-width="2"/><path d="M781 167 L790 174 L781 181" stroke="#71839a" stroke-width="2" fill="none"/><rect x="793" y="75" width="239" height="174" rx="9" fill="#f7f9fc" stroke="#9caaba"/><text x="913" y="99" font-size="16" font-weight="bold" text-anchor="middle">Compare learning curves</text><g transform="translate(822 114)"><path d="M0 0 V106 H185" stroke="#34455b" stroke-width="1.5" fill="none"/><path d="M0 91 C40 70 80 58 185 47" stroke="#557aaf" stroke-width="2.4" fill="none"/><path d="M0 91 C30 48 75 30 185 22" stroke="#368b70" stroke-width="2.4" fill="none"/><path d="M0 91 C40 58 90 42 185 34" stroke="#c08436" stroke-width="2.4" fill="none"/><path d="M0 91 C40 66 90 52 185 41" stroke="#8b6bb6" stroke-width="2.4" fill="none"/></g><text x="913" y="240" font-size="11" text-anchor="middle">Number of labeled examples →</text><text x="523" y="318" font-size="15" font-weight="bold" text-anchor="middle">Which strategy achieves better validation performance for the same labeling budget?</text></g></svg>